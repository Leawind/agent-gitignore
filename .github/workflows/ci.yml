name: ci

on:
  push:
  pull_request:

jobs:
  gitignore-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify example .gitignore files
        run: bash scripts/test-gitignore.sh
      - name: Verify per-tool snippets are in sync
        run: bash scripts/build-per-tool.sh && git diff --exit-code -- examples/per-tool
